[package]
name = "glitchtip-cli"
version = "1.0.0"
edition = "2024"
description = "Open source CLI for GlitchTip"
license = "MIT"
repository = "https://gitlab.com/glitchtip/glitchtip-cli"
homepage = "https://glitchtip.com"
readme = "README.md"
keywords = ["glitchtip", "cli", "error-tracking", "devops"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "glitchtip-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "now"] }
dirs = "6"
flate2 = "1"
proguard = { version = "5", features = ["uuid"] }
symbolic = { version = "12", features = ["debuginfo"] }
walkdir = "2"
zip = { version = "7", default-features = false, features = ["deflate"] }
open = "5"
rpassword = "7"
urlencoding = "2"
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
sourcemap = "9.3.2"

[dev-dependencies]
mockito = "1"
tempfile = "3"
